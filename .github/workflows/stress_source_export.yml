name: stress-source-export

on:
  push:
    branches:
      - stress-export-849a75273831

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact main snapshot
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/noetrium-fa2573769e0dcde1d80ba350bf6091c642e09f54.tar.gz" fa2573769e0dcde1d80ba350bf6091c642e09f54
          sha256sum "$RUNNER_TEMP/noetrium-fa2573769e0dcde1d80ba350bf6091c642e09f54.tar.gz" > "$RUNNER_TEMP/noetrium-fa2573769e0dcde1d80ba350bf6091c642e09f54.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: noetrium-stress-source-fa2573769e0dcde1d80ba350bf6091c642e09f54
          path: |
            ${{ runner.temp }}/noetrium-fa2573769e0dcde1d80ba350bf6091c642e09f54.tar.gz
            ${{ runner.temp }}/noetrium-fa2573769e0dcde1d80ba350bf6091c642e09f54.tar.gz.sha256
          if-no-files-found: error
