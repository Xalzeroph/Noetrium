name: research-projection-maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install platform
        run: python -m pip install -e .
      - name: Verify research projections when maintaining the workspace
        run: |
          python scripts/sync_benchmark_manifests.py --check
          python scripts/sync_reproductions.py --check
          python scripts/sync_research_pressure.py --check --enforce
          python scripts/sync_publication_priority.py --check --enforce
          python scripts/sync_research_program.py --check
          python scripts/sync_lineage_status.py --check
