name: research-workspace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/**"
      - "benchmarks/**"
      - "tests/test_scientific_*.py"
      - "tests/test_research_*.py"
      - "tests/test_reproduction_*.py"
      - "tests/test_publication_*.py"
      - "tests/test_lineage_*.py"
      - "scripts/sync_benchmark_manifests.py"
      - "scripts/sync_reproductions.py"
      - "scripts/sync_publication_priority.py"
      - "scripts/sync_research_pressure.py"
      - "scripts/sync_research_program.py"
      - "scripts/sync_lineage_status.py"
      - ".github/workflows/research_workspace.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "benchmarks/**"
      - "tests/test_scientific_*.py"
      - "tests/test_research_*.py"
      - "tests/test_reproduction_*.py"
      - "tests/test_publication_*.py"
      - "tests/test_lineage_*.py"
      - "scripts/sync_benchmark_manifests.py"
      - "scripts/sync_reproductions.py"
      - "scripts/sync_publication_priority.py"
      - "scripts/sync_research_pressure.py"
      - "scripts/sync_research_program.py"
      - "scripts/sync_lineage_status.py"
      - ".github/workflows/research_workspace.yml"

concurrency:
  group: research-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: research workspace preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Reject source-project design traces from platform implementation
        run: python scripts/project_design_trace_gate.py

      - name: Verify research workspace projections converge
        run: |
          python scripts/sync_benchmark_manifests.py
          python scripts/sync_reproductions.py
          python scripts/sync_research_pressure.py
          python scripts/sync_publication_priority.py
          python scripts/sync_research_program.py
          python scripts/sync_lineage_status.py

          python scripts/sync_benchmark_manifests.py --check
          python scripts/sync_reproductions.py --check
          python scripts/sync_research_pressure.py --check --enforce
          python scripts/sync_publication_priority.py --check --enforce
          python scripts/sync_research_program.py --check
          python scripts/sync_lineage_status.py --check

      - name: Verify research workspace test ownership
        run: python research/tools/test_selection.py check

  affected:
    name: affected research tests
    needs: preflight
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run affected research workspace tests
        env:
          RESEARCH_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: python research/tools/test_selection.py run-affected "$RESEARCH_BASE_SHA"

  full:
    name: full research tests
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run full research workspace tests
        run: python research/tools/test_selection.py run
