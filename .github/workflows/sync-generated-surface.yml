name: sync-generated-surface

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/server-sync-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout synchronization branch
        uses: actions/checkout@v4
        with:
          ref: codex/server-sync-20260908
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize canonical generated surface
        run: python scripts/generate_downstream_contracts.py
      - name: Restore canonical assurance workflow
        run: git checkout origin/main -- .github/workflows/ci.yml
      - name: Remove one-shot synchronization workflow
        run: git rm .github/workflows/sync-generated-surface.yml
      - name: Commit exact generated files
        run: |
          git config user.name 'Noetrium Generated Surface Sync'
          git config user.email 'noetrium-generated-sync@users.noreply.github.com'
          git add README*.md docs/architecture/DOWNSTREAM_CAPABILITY_CATALOG.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'Generated surface already synchronized.'
            exit 0
          fi
          git commit -m 'docs: synchronize generated downstream surface'
          git push origin HEAD:codex/server-sync-20260908
