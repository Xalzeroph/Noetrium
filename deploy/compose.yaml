name: noetrium

services:
  platform-runtime:
    image: ${PLATFORM_IMAGE:-noetrium:local}
    init: true
    restart: "no"
    environment:
      PLATFORM_STATE_DIR: /var/lib/noetrium
      NOETRIUM_ENVIRONMENT_PROFILE: base
    volumes:
      - type: bind
        source: ${PLATFORM_HOST_DATA_ROOT:-./.runtime}/platform-state
        target: /var/lib/noetrium
    healthcheck:
      test: ["CMD", "/usr/local/bin/noetrium-entrypoint", "environment-doctor", "base"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
