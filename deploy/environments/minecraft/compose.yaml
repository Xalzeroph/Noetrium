services:
  platform-runtime:
    build:
      context: ..
      dockerfile: deploy/environments/minecraft/Dockerfile
      args:
        PLATFORM_BASE_IMAGE: ${PLATFORM_IMAGE:-noetrium:local}
        NOETRIUM_ENVIRONMENT_PROFILE_ID: ${NOETRIUM_ENVIRONMENT_PROFILE_ID:?profile id required}
        NOETRIUM_ENVIRONMENT_CATEGORY_ID: ${NOETRIUM_ENVIRONMENT_CATEGORY_ID:?category id required}
        NOETRIUM_ENVIRONMENT_PROFILE_REVISION: ${NOETRIUM_ENVIRONMENT_PROFILE_REVISION:?profile revision required}
        NOETRIUM_ENVIRONMENT_BUILD_INPUT_DIGEST: ${NOETRIUM_ENVIRONMENT_BUILD_INPUT_DIGEST:?build input digest required}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21-jre-jammy}
        NODE_VERSION: ${NODE_VERSION:-22.22.2}
    image: ${PLATFORM_MINECRAFT_IMAGE:-noetrium-env-minecraft:local}
    environment:
      NOETRIUM_ENVIRONMENT_PROFILE: minecraft
      MC_DATA_DIR: /var/lib/minecraft
    volumes:
      - type: bind
        source: ${PLATFORM_ENVIRONMENT_INSTANCE_ROOT:?set PLATFORM_ENVIRONMENT_INSTANCE_ROOT to a per-instance writable directory}/minecraft
        target: /var/lib/minecraft
    healthcheck:
      test: ["CMD", "/usr/local/bin/noetrium-entrypoint", "environment-doctor", "minecraft"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
