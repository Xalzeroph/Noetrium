services:
  platform-runtime:
    build:
      context: ..
      dockerfile: deploy/environments/web/Dockerfile
      args:
        PLATFORM_ENVIRONMENT_BASE_IMAGE: ${PLATFORM_ENVIRONMENT_BASE_IMAGE:-noetrium-env-base:local}
        NOETRIUM_ENVIRONMENT_PROFILE_ID: ${NOETRIUM_ENVIRONMENT_PROFILE_ID:?profile id required}
        NOETRIUM_ENVIRONMENT_CATEGORY_ID: ${NOETRIUM_ENVIRONMENT_CATEGORY_ID:?category id required}
        NOETRIUM_ENVIRONMENT_PROFILE_REVISION: ${NOETRIUM_ENVIRONMENT_PROFILE_REVISION:?profile revision required}
        NOETRIUM_ENVIRONMENT_BUILD_INPUT_DIGEST: ${NOETRIUM_ENVIRONMENT_BUILD_INPUT_DIGEST:?build input digest required}
    image: ${PLATFORM_WEB_IMAGE:-noetrium-env-web:local}
    environment:
      NOETRIUM_ENVIRONMENT_PROFILE: web
    healthcheck:
      test: ["CMD", "/usr/local/bin/noetrium-entrypoint", "environment-doctor", "web"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
